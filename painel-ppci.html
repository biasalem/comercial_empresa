<title>Painel PPCI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg: #F3F4F0;
    --surface: #FFFFFF;
    --surface-2: #EAECE6;
    --border: #D7D9D1;
    --border-strong: #C2C6BB;
    --text: #1D2320;
    --text-muted: #5C665F;
    --text-faint: #8A928B;

    --accent: #1F4E5F;
    --accent-ink: #F2F7F9;
    --accent-vistoria: #7A6533;
    --accent-vistoria-completa: #8C4A2E;
    --accent-fire: #B94E1D;
    --accent-clcb: #96631A;
    --accent-laudo: #6B4577;
    --accent-revisao: #3F6B4A;
    --accent-other: #56566E;

    --success: #2F7D5A;
    --success-bg: #E4F0E8;
    --danger: #B3392C;
    --danger-bg: #FBE7E3;
    --warning: #9C7215;
    --warning-bg: #F6ECD6;
    --neutral-bg: #ECEEE9;

    --shadow: 0 1px 2px rgba(20,25,20,0.06), 0 4px 14px rgba(20,25,20,0.05);
    --radius-s: 6px;
    --radius-m: 10px;
    --radius-l: 14px;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #14181A;
      --surface: #1C2224;
      --surface-2: #232A2C;
      --border: #333C3E;
      --border-strong: #454F51;
      --text: #E7EAE6;
      --text-muted: #9DA8A2;
      --text-faint: #71807A;

      --accent: #6BAFCB;
      --accent-ink: #0D2029;
      --accent-vistoria: #CBB876;
      --accent-vistoria-completa: #D99B76;
      --accent-fire: #E6875A;
      --accent-clcb: #DDAE5E;
      --accent-laudo: #C79ADB;
      --accent-revisao: #7FC79A;
      --accent-other: #A9A9CB;

      --success: #63C293;
      --success-bg: #17311F;
      --danger: #E4796A;
      --danger-bg: #3A1F1B;
      --warning: #E2BB61;
      --warning-bg: #362A0F;
      --neutral-bg: #262E2F;

      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 18px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg: #14181A;
    --surface: #1C2224;
    --surface-2: #232A2C;
    --border: #333C3E;
    --border-strong: #454F51;
    --text: #E7EAE6;
    --text-muted: #9DA8A2;
    --text-faint: #71807A;

    --accent: #6BAFCB;
    --accent-ink: #0D2029;
    --accent-vistoria: #CBB876;
    --accent-vistoria-completa: #D99B76;
    --accent-fire: #E6875A;
    --accent-clcb: #DDAE5E;
    --accent-laudo: #C79ADB;
    --accent-revisao: #7FC79A;
    --accent-other: #A9A9CB;

    --success: #63C293;
    --success-bg: #17311F;
    --danger: #E4796A;
    --danger-bg: #3A1F1B;
    --warning: #E2BB61;
    --warning-bg: #362A0F;
    --neutral-bg: #262E2F;

    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 18px rgba(0,0,0,0.35);
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  a{ color:inherit; }

  /* ---------- layout shell ---------- */
  .app{ display:flex; flex-direction:column; height:100vh; min-height:560px; }

  header.topbar{
    padding: 18px 24px 14px;
    border-bottom:1px solid var(--border);
    background:var(--surface);
    display:flex; flex-wrap:wrap; gap:16px 28px; align-items:flex-end; justify-content:space-between;
  }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--accent); font-weight:600;
  }
  .brand h1{ margin:0; font-size:21px; font-weight:600; text-wrap:balance; }
  .brand .sub{ color:var(--text-muted); font-size:12.5px; }

  .stats{ display:flex; gap:10px; flex-wrap:wrap; }
  .stat{
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-m);
    padding:8px 14px; min-width:118px;
  }
  .stat.clickable{ cursor:pointer; }
  .stat.clickable:hover{ border-color:var(--border-strong); }
  .stat.active{ border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
  .stat .n{ font-family:'IBM Plex Mono',monospace; font-size:17px; font-weight:600; line-height:1.1; }
  .stat .l{ color:var(--text-muted); font-size:11px; margin-top:2px; }

  .btn{
    appearance:none; border:1px solid var(--border-strong); background:var(--surface);
    color:var(--text); border-radius:var(--radius-s); padding:8px 14px; font:inherit; font-weight:500;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .btn:hover{ border-color:var(--accent); }
  .btn:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-ghost{ border-color:transparent; background:transparent; padding:6px 8px; }
  .btn-ghost:hover{ background:var(--surface-2); border-color:var(--border); }
  .btn-sm{ padding:5px 9px; font-size:12.5px; }
  .btn-danger-text{ color:var(--danger); }

  /* ---------- tabs ---------- */
  .tabbar{
    padding:0 24px; display:flex; gap:22px; border-bottom:1px solid var(--border); background:var(--surface);
  }
  .tab-btn{
    border:none; background:transparent; padding:11px 2px; margin-bottom:-1px; border-bottom:2px solid transparent;
    color:var(--text-muted); font:inherit; font-weight:600; font-size:13px; cursor:pointer;
  }
  .tab-btn:hover{ color:var(--text); }
  .tab-btn[aria-selected="true"]{ color:var(--accent); border-bottom-color:var(--accent); }

  .toolbar{
    padding:12px 24px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    border-bottom:1px solid var(--border); background:var(--bg);
  }
  .search{
    flex:1 1 220px; max-width:340px; display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-s); padding:7px 10px;
  }
  .search svg{ flex:none; opacity:.55; }
  .search input{ border:none; outline:none; background:transparent; color:var(--text); font:inherit; width:100%; }
  .chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip-toggle{
    border:1px solid var(--border); background:var(--surface); color:var(--text-muted);
    border-radius:999px; padding:5px 12px; font-size:12.5px; font-weight:500; cursor:pointer;
  }
  .chip-toggle[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }

  .example-banner{
    margin:0 24px; margin-top:12px; padding:9px 14px; border-radius:var(--radius-s);
    background:var(--warning-bg); color:var(--warning); border:1px solid color-mix(in srgb, var(--warning) 35%, transparent);
    font-size:12.5px; display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap;
  }
  .example-banner .msg{ display:flex; gap:8px; align-items:center; }
  .example-banner button{ color:var(--warning); border-color:color-mix(in srgb, var(--warning) 45%, transparent); background:transparent; }

  .offline-banner{
    margin:0 24px; margin-top:12px; padding:9px 14px; border-radius:var(--radius-s);
    background:var(--danger-bg); color:var(--danger); border:1px solid color-mix(in srgb, var(--danger) 35%, transparent);
    font-size:12.5px;
  }

  /* ---------- board (pipeline) ---------- */
  .board-wrap{ flex:1; overflow:auto; padding:18px 24px 8px; }
  .board{ display:grid; grid-auto-flow:column; grid-auto-columns:272px; gap:14px; align-items:start; min-height:100%; }
  .col{ background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-l); display:flex; flex-direction:column; max-height:100%; }
  .col-head{ padding:12px 12px 10px; border-bottom:1px solid var(--border); }
  .col-head .row1{ display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .col-head h2{ margin:0; font-size:12.5px; font-weight:600; letter-spacing:.01em; }
  .col-count{
    font-family:'IBM Plex Mono',monospace; font-size:11px; background:var(--surface); border:1px solid var(--border);
    border-radius:999px; padding:1px 7px; color:var(--text-muted);
  }
  .col-total{ margin-top:4px; font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; color:var(--text-muted); }
  .col-body{ flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:9px; min-height:60px; }
  .col-add{
    margin:0 10px 10px; padding:7px; border-radius:var(--radius-s); border:1px dashed var(--border-strong);
    background:transparent; color:var(--text-muted); font-size:12.5px; cursor:pointer; text-align:center;
  }
  .col-add:hover{ border-color:var(--accent); color:var(--accent); }
  .col-empty{ color:var(--text-faint); font-size:12px; text-align:center; padding:14px 6px; }

  /* ---------- card ---------- */
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);
    padding:11px 12px 9px; box-shadow:var(--shadow); cursor:pointer; position:relative;
  }
  .card:hover{ border-color:var(--border-strong); }
  .card-top{ display:flex; justify-content:space-between; gap:6px; align-items:flex-start; }
  .card-name{ font-weight:600; font-size:13.5px; text-wrap:balance; }
  .card-contato{ color:var(--text-muted); font-size:11.5px; margin-top:2px; }
  .menu-btn{ flex:none; border:none; background:transparent; color:var(--text-faint); cursor:pointer; padding:2px 4px; border-radius:4px; line-height:1; font-size:16px; }
  .menu-btn:hover{ background:var(--neutral-bg); color:var(--text); }

  .tag{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:3px 8px;
    border-radius:999px; margin-top:8px;
  }
  .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }

  .card-value{ margin-top:8px; font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14px; }
  .card-example{ font-size:10px; color:var(--text-faint); border:1px solid var(--border); border-radius:4px; padding:1px 5px; margin-left:6px; vertical-align:1px; }

  .card-next{
    margin-top:8px; padding-top:8px; border-top:1px dashed var(--border); font-size:11.5px; color:var(--text-muted);
    display:flex; justify-content:space-between; gap:6px; align-items:baseline;
  }
  .card-next .lbl{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .due{ font-family:'IBM Plex Mono',monospace; font-weight:600; flex:none; padding:1px 6px; border-radius:4px; }
  .due.ok{ color:var(--text-muted); background:var(--neutral-bg); }
  .due.soon{ color:var(--warning); background:var(--warning-bg); }
  .due.late{ color:var(--danger); background:var(--danger-bg); }

  .card-move{ display:flex; justify-content:space-between; align-items:center; margin-top:9px; }
  .move-btns{ display:flex; gap:4px; }
  .move-btns button{
    border:1px solid var(--border); background:var(--surface); color:var(--text-muted); border-radius:5px;
    width:22px; height:22px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:12px;
  }
  .move-btns button:hover:not(:disabled){ border-color:var(--accent); color:var(--accent); }
  .move-btns button:disabled{ opacity:.3; cursor:default; }

  /* dropdown menu */
  .menu-pop{
    position:absolute; right:8px; top:32px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-s); box-shadow:var(--shadow); z-index:30; min-width:180px; padding:4px; display:none;
  }
  .menu-pop.open{ display:block; }
  .menu-pop button{
    display:flex; width:100%; text-align:left; border:none; background:transparent; padding:7px 9px; font:inherit;
    color:var(--text); cursor:pointer; border-radius:6px; font-size:12.5px;
  }
  .menu-pop button:hover{ background:var(--neutral-bg); }

  /* ---------- perdidos ---------- */
  .lost-wrap{ border-top:1px solid var(--border); background:var(--surface); }
  .lost-toggle{
    width:100%; display:flex; align-items:center; gap:8px; justify-content:space-between; padding:10px 24px;
    border:none; background:transparent; color:var(--text-muted); font:inherit; cursor:pointer;
  }
  .lost-toggle:hover{ color:var(--text); }
  .lost-toggle .car{ transition:transform .15s ease; }
  .lost-toggle.open .car{ transform:rotate(180deg); }
  .lost-list{ display:none; padding:0 24px 16px; gap:8px; flex-wrap:wrap; }
  .lost-list.open{ display:flex; }
  .lost-item{
    display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:999px; padding:5px 6px 5px 12px; font-size:12px;
  }
  .lost-item b{ font-weight:600; }
  .lost-item button{ border:none; background:var(--surface); border-radius:999px; padding:3px 10px; cursor:pointer; font:inherit; font-size:11.5px; color:var(--accent); border:1px solid var(--border); }

  /* ---------- certificados (list view) ---------- */
  .certlist-wrap{ flex:1; overflow:auto; padding:18px 24px 24px; }
  .certlist{ display:flex; flex-direction:column; gap:9px; max-width:980px; }
  .cert-row{
    position:relative; display:flex; flex-wrap:wrap; align-items:center; gap:16px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);
    padding:12px 16px; box-shadow:var(--shadow); cursor:pointer;
  }
  .cert-row:hover{ border-color:var(--border-strong); }
  .cert-row .tag{ margin-top:0; flex:none; }
  .cert-main{ flex:1 1 220px; min-width:180px; }
  .cert-main .nm{ font-weight:600; font-size:13.5px; }
  .cert-main .sub{ color:var(--text-muted); font-size:11.5px; margin-top:2px; }
  .cert-dates{ flex:none; font-size:11.5px; color:var(--text-muted); display:flex; flex-direction:column; gap:2px; min-width:140px; }
  .cert-dates b{ color:var(--text); font-weight:600; }
  .cert-status{ flex:none; }
  .cert-empty{ text-align:center; color:var(--text-faint); padding:48px 10px; font-size:13px; }

  /* ---------- pdf upload / autofill ---------- */
  .pdf-upload{ border:1px dashed var(--border-strong); border-radius:var(--radius-s); padding:10px 12px; background:var(--surface-2); }
  .pdf-upload-label{ display:block; font-size:12.5px; font-weight:600; color:var(--text); margin-bottom:2px; }
  .pdf-upload-hint{ display:block; font-size:11px; color:var(--text-faint); margin-bottom:7px; }
  .pdf-upload input[type=file]{ font-size:12px; color:var(--text-muted); width:100%; }
  .pdf-upload input[type=file]::file-selector-button{
    border:1px solid var(--border-strong); background:var(--surface); color:var(--text); border-radius:var(--radius-s);
    padding:5px 10px; font:inherit; font-size:12px; margin-right:8px; cursor:pointer;
  }
  .pdf-upload-status{ margin-top:7px; font-size:11.5px; color:var(--text-muted); min-height:14px; }
  .pdf-upload-status.err{ color:var(--danger); }
  .pdf-upload-status.ok{ color:var(--success); }

  /* ---------- modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(15,18,16,.45); backdrop-filter:blur(1px);
    display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); width:100%; max-width:440px;
    max-height:92vh; overflow-y:auto; box-shadow:var(--shadow);
  }
  .modal-head{ padding:16px 20px 10px; display:flex; justify-content:space-between; align-items:center; }
  .modal-head h3{ margin:0; font-size:16px; font-weight:600; }
  .modal-body{ padding:4px 20px 20px; display:flex; flex-direction:column; gap:13px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:5px; }
  .field input, .field select, .field textarea{
    width:100%; border:1px solid var(--border-strong); background:var(--bg); color:var(--text); border-radius:var(--radius-s);
    padding:8px 10px; font:inherit;
  }
  .field textarea{ resize:vertical; min-height:56px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .modal-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:4px; gap:10px; }
  .req-err{ color:var(--danger); font-size:11.5px; min-height:14px; }

  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
</style>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="eyebrow">PPCI · Comercial</span>
      <h1>Painel comercial</h1>
      <span class="sub">Vendas, financeiro, vistorias e vencimentos de CLCB/AVCB</span>
    </div>
    <div class="stats" id="stats"></div>
    <button class="btn btn-primary" id="btnNovo">+ Novo lead</button>
  </header>

  <div class="tabbar" role="tablist" aria-label="Seções do painel">
    <button class="tab-btn" data-tab="pipeline" role="tab" aria-selected="true">Pipeline de vendas</button>
    <button class="tab-btn" data-tab="financeiro" role="tab" aria-selected="false">Financeiro</button>
    <button class="tab-btn" data-tab="certificados" role="tab" aria-selected="false">Vencimentos CLCB/AVCB</button>
  </div>

  <div class="toolbar">
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="Buscar por cliente ou contato…" aria-label="Buscar" />
    </div>
    <div class="chips" id="filterChips" role="group" aria-label="Filtrar"></div>
  </div>

  <div id="exampleBanner"></div>
  <div id="offlineBanner"></div>

  <div class="board-wrap" id="boardWrap">
    <div class="board" id="board"></div>
  </div>

  <div class="board-wrap" id="finBoardWrap" style="display:none;">
    <div class="board" id="finBoard"></div>
  </div>

  <div class="certlist-wrap" id="certListWrap" style="display:none;">
    <div class="certlist" id="certList"></div>
  </div>

  <div class="lost-wrap" id="lostWrap">
    <button class="lost-toggle" id="lostToggle">
      <span id="lostToggleLabel">Perdidos (0)</span>
      <svg class="car" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="lost-list" id="lostList"></div>
  </div>
</div>

<div id="modalRoot"></div>

<script>
(function(){
  "use strict";

  var STAGES = [
    { id:'recebido',    label:'Lead Recebido' },
    { id:'diagnostico', label:'Diagnóstico / Visita Técnica' },
    { id:'proposta',    label:'Proposta Enviada' },
    { id:'negociacao',  label:'Negociação' },
    { id:'fechado',     label:'Contrato Fechado' }
  ];
  var STAGE_IDS = STAGES.map(function(s){ return s.id; });

  var FIN_STAGES = [
    { id:'aguardando_sinal', label:'Aguardando pagamento de sinal' },
    { id:'aguardando_nota',  label:'Aguardando emissão de nota' },
    { id:'sinal_recebido',   label:'Sinal recebido' },
    { id:'pagamento_total',  label:'Pagamento total recebido' },
    { id:'finalizado',       label:'Serviço finalizado' }
  ];
  var FIN_STAGE_IDS = FIN_STAGES.map(function(s){ return s.id; });

  var SERVICE_TYPES = {
    estrutural:        { label:'Projeto Estrutural',    varName:'--accent' },
    revisao:           { label:'Revisão de Projeto',    varName:'--accent-revisao' },
    vistoria_simples:  { label:'Vistoria Simples',      varName:'--accent-vistoria' },
    vistoria_completa: { label:'Vistoria Completa',     varName:'--accent-vistoria-completa' },
    laudos:            { label:'Laudos',                varName:'--accent-laudo' },
    ppci:              { label:'PPCI',                  varName:'--accent-fire' },
    clcb:              { label:'CLCB',                  varName:'--accent-clcb' }
  };
  // Fallback for leads saved under a category no longer offered (never shown as a selectable option).
  var UNKNOWN_SERVICE_TYPE = { label:'Outro / não categorizado', varName:'--accent-other' };

  var CERT_TYPES = {
    clcb: { label:'CLCB', varName:'--accent' },
    avcb: { label:'AVCB', varName:'--accent-fire' }
  };

  var currencyFmt = new Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL', maximumFractionDigits:0 });

  function fmtMoney(v){
    var n = Number(v);
    if(!isFinite(n)) n = 0;
    return currencyFmt.format(n);
  }
  function fmtDatePt(iso){
    if(!iso) return '';
    var d = parseLocalDate(iso);
    if(!d) return '';
    return d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year: (d.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined) });
  }
  function parseLocalDate(iso){
    if(!iso) return null;
    var parts = iso.split('-');
    if(parts.length !== 3) return null;
    var d = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
    return isNaN(d.getTime()) ? null : d;
  }
  function todayLocal(){
    var t = new Date(); t.setHours(0,0,0,0); return t;
  }
  function daysBetween(a,b){
    return Math.round((b.getTime()-a.getTime()) / 86400000);
  }
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }
  function uid(){ return 'x' + Math.random().toString(36).slice(2,9); }

  /* ---------------- filter chips ---------------- */
  function buildChips(){

    var activeSet = currentView === 'pipeline' ? activeTipoFilters : (currentView === 'financeiro' ? activeFinTipoFilters : activeCertTipoFilters);
    Object.keys(defs).forEach(function(key){

  /* ---------------- persistence ---------------- */
  function nowIso(){ return new Date().toISOString(); }

  function applyLocalSnapshot(col){
    if(col === 'leads') leads = offlineStores.leads.slice();
    else if(col === 'financeiro') financeiro = offlineStores.financeiro.slice();
    else certs = offlineStores.certificados.slice();
    render();
  }
  function persistAdd(col, data){
    if(dbHandle){
      return dbHandle.collection(col).add(data);
    }
    var doc = Object.assign({ id: uid() }, data);
    offlineStores[col].push(doc);
    applyLocalSnapshot(col);
    return Promise.resolve(doc);
  }
  function persistUpdate(col, id, patch){
    if(dbHandle){
      return dbHandle.doc(col + '/' + id).update(patch);
    }
    var it = offlineStores[col].find(function(x){ return x.id === id; });
    if(it) Object.assign(it, patch);
    applyLocalSnapshot(col);
    return Promise.resolve();
  }
  function persistDelete(col, id){
    if(dbHandle){
      return dbHandle.doc(col + '/' + id).delete();
    }
    offlineStores[col] = offlineStores[col].filter(function(x){ return x.id !== id; });
    applyLocalSnapshot(col);
    return Promise.resolve();
  }
  function persistDeleteMany(col, ids){
    var set = new Set(ids);
    if(dbHandle){
      return Promise.all(ids.map(function(id){ return dbHandle.doc(col + '/' + id).delete(); }));
    }
    offlineStores[col] = offlineStores[col].filter(function(x){ return !set.has(x.id); });
    applyLocalSnapshot(col);
    return Promise.resolve();
  }

  function initDb(){
    if(!window.claude || typeof window.claude.use !== 'function'){
      offline = true; renderOfflineBanner(); return;
    }
    window.claude.use('db').then(function(db){
      if(!db){ offline = true; renderOfflineBanner(); return; }
      dbHandle = db;
      db.collection('leads').onSnapshot(function(snap){
        leads = snap.docs.map(function(d){ return Object.assign({ id:d.id }, d.data()); });
        render();
      }, function(){ offline = true; renderOfflineBanner(); });
      db.collection('certificados').onSnapshot(function(snap){
        certs = snap.docs.map(function(d){ return Object.assign({ id:d.id }, d.data()); });
        render();
      }, function(){ offline = true; renderOfflineBanner(); });
      db.collection('financeiro').onSnapshot(function(snap){
        financeiro = snap.docs.map(function(d){ return Object.assign({ id:d.id }, d.data()); });
        render();
      }, function(){ offline = true; renderOfflineBanner(); });
    }).catch(function(){ offline = true; renderOfflineBanner(); });
  }

    } else {
      els.offlineBanner.innerHTML = '';
    }
  }

  /* ---------------- pipeline: filtering / stats / render ---------------- */
  function filteredLeads(){
    return leads.filter(function(l){
      if(activeTipoFilters.size && !activeTipoFilters.has(l.tipoServico)) return false;
      if(search){
        var hay = ((l.nome||'') + ' ' + (l.contato||'')).toLowerCase();
        if(hay.indexOf(search) === -1) return false;
      }
      return true;
    });
  }

  function computeLeadStats(all){
    var active = all.filter(function(l){ return l.etapa !== 'fechado' && l.etapa !== 'perdido'; });
    var pipelineValue = active.reduce(function(s,l){ return s + (Number(l.valorEstimado)||0); }, 0);
    var thisMonth = new Date();
    var fechadosMes = all.filter(function(l){
      if(l.etapa !== 'fechado') return false;
      var d = new Date(l.atualizadoEm || l.criadoEm || 0);
      return d.getFullYear() === thisMonth.getFullYear() && d.getMonth() === thisMonth.getMonth();
    }).length;
    return { activos: active.length, pipelineValue: pipelineValue, fechadosMes: fechadosMes };
  }

  function dueInfo(l){
    if(!l.prazo || l.etapa === 'fechado' || l.etapa === 'perdido') return null;
    var d = parseLocalDate(l.prazo);
    if(!d) return null;
    var diff = daysBetween(todayLocal(), d);
    if(diff < 0) return { cls:'late', text:'atrasado ' + Math.abs(diff) + 'd' };
    if(diff === 0) return { cls:'soon', text:'hoje' };
    if(diff <= 3) return { cls:'soon', text:'em ' + diff + 'd' };
    return { cls:'ok', text: fmtDatePt(l.prazo) };
  }

  /* ---------------- certificados: filtering / stats / render ---------------- */
  function certStatus(c){
    var d = parseLocalDate(c.dataVencimento);
    if(!d) return { key:'semdata', cls:'ok', label:'Sem vencimento cadastrado' };
    var diff = daysBetween(todayLocal(), d);
    if(diff < 0) return { key:'vencido', cls:'late', label:'Vencido há ' + Math.abs(diff) + 'd' };
    if(diff <= 30) return { key:'vencendo', cls:'soon', label:'Vence em ' + diff + 'd' };
    return { key:'ok', cls:'ok', label:'Válido até ' + fmtDatePt(c.dataVencimento) };
  }

  function computeCertStats(all){
    var vencidos = 0, vencendo = 0, ok = 0;
    all.forEach(function(c){
      var k = certStatus(c).key;
      if(k === 'vencido') vencidos++; else if(k === 'vencendo') vencendo++; else if(k === 'ok') ok++;
    });
    return { vencidos: vencidos, vencendo: vencendo, ok: ok, total: all.length };
  }

  function filteredCerts(){
    return certs.filter(function(c){
      if(activeCertTipoFilters.size && !activeCertTipoFilters.has(c.tipo)) return false;
      if(certStatusFilter && certStatus(c).key !== certStatusFilter) return false;
      if(certSearch){
        var hay = ((c.cliente||'')+' '+(c.endereco||'')+' '+(c.contato||'')+' '+(c.numeroProcesso||'')).toLowerCase();
        if(hay.indexOf(certSearch) === -1) return false;
      }
      return true;
    }).sort(function(a,b){
      var da = a.dataVencimento || '9999-99-99';
      var db_ = b.dataVencimento || '9999-99-99';
      return da < db_ ? -1 : (da > db_ ? 1 : 0);
    });
  }

  /* ---------------- financeiro: filtering / stats / render ---------------- */
  // Called when a lead's etapa transitions INTO 'fechado' — creates the matching project
  // in the Financeiro kanban, starting at the first stage. Guarded by lead.financeiroCriado
  // at the call sites so a lead only ever spawns one project, even if saved again later.
  function createFinanceiroProject(lead){
    var data = {
      leadId: lead.id || null,
      cliente: lead.nome || '',
      tipoServico: lead.tipoServico || null,
      valor: Number(lead.valorEstimado) || 0,
      contato: lead.contato || '',
      etapa: FIN_STAGE_IDS[0],
      observacoes: '',
      isExample: false,
      criadoEm: nowIso(),
      atualizadoEm: nowIso()
    };
    persistAdd('financeiro', data);
  }

  function filteredFinanceiro(){
    return financeiro.filter(function(p){
      if(activeFinTipoFilters.size && !activeFinTipoFilters.has(p.tipoServico)) return false;
      if(finSearch){
        var hay = ((p.cliente||'') + ' ' + (p.contato||'')).toLowerCase();
        if(hay.indexOf(finSearch) === -1) return false;
      }
      return true;
    });
  }

  function computeFinStats(all){
    var pendentes = all.filter(function(p){ return p.etapa !== 'finalizado'; });
    var aReceber = pendentes.reduce(function(s,p){ return s + (Number(p.valor)||0); }, 0);
    var thisMonth = new Date();
    var finalizadosMes = all.filter(function(p){
      if(p.etapa !== 'finalizado') return false;
      var d = new Date(p.atualizadoEm || p.criadoEm || 0);
      return d.getFullYear() === thisMonth.getFullYear() && d.getMonth() === thisMonth.getMonth();
    }).length;
    return { emAndamento: pendentes.length, aReceber: aReceber, finalizadosMes: finalizadosMes };
  }

  function finCardHtml(p){
    var svc = SERVICE_TYPES[p.tipoServico] || UNKNOWN_SERVICE_TYPE;
    var idx = FIN_STAGE_IDS.indexOf(p.etapa);
    var mkey = 'financeiro:' + p.id;

  /* ---------------- event delegation ---------------- */
  document.addEventListener('click', function(e){
    var statFilterBtn = e.target.closest('[data-statfilter]');
    if(statFilterBtn){
      var key = statFilterBtn.getAttribute('data-statfilter');
      certStatusFilter = (certStatusFilter === key) ? null : key;
      render();
      return;
    }

    var addStageBtn = e.target.closest('[data-addstage]');
    if(addStageBtn){
      var addCol = addStageBtn.getAttribute('data-col') || 'leads';
      if(addCol === 'financeiro') openFinModal(null, addStageBtn.getAttribute('data-addstage'));
      else openLeadModal(null, addStageBtn.getAttribute('data-addstage'));
      return;
    }

    var moveBtn = e.target.closest('[data-move]');
    if(moveBtn){
      e.stopPropagation();
      var id = moveBtn.getAttribute('data-id');
      var dir = moveBtn.getAttribute('data-move');
      var moveCol = moveBtn.getAttribute('data-col') || 'leads';
      if(moveCol === 'financeiro'){
        var proj = financeiro.find(function(p){ return p.id === id; });
        if(!proj) return;
        var pidx = FIN_STAGE_IDS.indexOf(proj.etapa);
        var pNewIdx = dir === 'next' ? pidx+1 : pidx-1;
        if(pNewIdx < 0 || pNewIdx >= FIN_STAGE_IDS.length) return;
        persistUpdate('financeiro', id, { etapa: FIN_STAGE_IDS[pNewIdx], atualizadoEm: nowIso() });
        return;
      }
      var lead = leads.find(function(l){ return l.id === id; });
      if(!lead) return;
      var idx = STAGE_IDS.indexOf(lead.etapa);
      var newIdx = dir === 'next' ? idx+1 : idx-1;
      if(newIdx < 0 || newIdx >= STAGE_IDS.length) return;
      var newEtapa = STAGE_IDS[newIdx];
      var patch = { etapa: newEtapa, atualizadoEm: nowIso() };
      if(newEtapa === 'fechado' && !lead.financeiroCriado){
        patch.financeiroCriado = true;
        createFinanceiroProject(lead);
      }
      persistUpdate('leads', id, patch);
      return;
    }

    var menuBtn = e.target.closest('[data-menu]');
    if(menuBtn){
      e.stopPropagation();
      var mv = menuBtn.getAttribute('data-menu');
      openMenuId = (openMenuId === mv) ? null : mv;
      render();
      return;
    }

    var actBtn = e.target.closest('[data-act]');
    if(actBtn){
      e.stopPropagation();
      var col = actBtn.getAttribute('data-col');
      var actId = actBtn.getAttribute('data-id');
      var act = actBtn.getAttribute('data-act');
      openMenuId = null;
      if(col === 'leads'){
        if(act === 'edit'){ openLeadModal(actId); }
        else if(act === 'lost'){
          var lead2 = leads.find(function(l){ return l.id === actId; });
          persistUpdate('leads', actId, { etapa:'perdido', etapaAnterior: lead2 ? lead2.etapa : 'recebido', atualizadoEm: nowIso() });
        } else if(act === 'delete'){
          var lead3 = leads.find(function(l){ return l.id === actId; });
          if(confirm('Excluir o lead "' + (lead3 ? lead3.nome : '') + '"? Essa ação não pode ser desfeita.')){
            persistDelete('leads', actId);
          } else { render(); }
        }
      } else if(col === 'certificados'){
        if(act === 'edit'){ openCertModal(actId); }
        else if(act === 'delete'){
          var cert3 = certs.find(function(c){ return c.id === actId; });
          if(confirm('Excluir o certificado de "' + (cert3 ? cert3.cliente : '') + '"? Essa ação não pode ser desfeita.')){
            persistDelete('certificados', actId);
          } else { render(); }
        }
      } else if(col === 'financeiro'){
        if(act === 'edit'){ openFinModal(actId); }
        else if(act === 'delete'){
          var proj3 = financeiro.find(function(p){ return p.id === actId; });
          if(confirm('Excluir o projeto financeiro de "' + (proj3 ? proj3.cliente : '') + '"? Essa ação não pode ser desfeita.')){
            persistDelete('financeiro', actId);
          } else { render(); }
        }
      }
      return;
    }

    var reactivateBtn = e.target.closest('[data-reactivate]');
    if(reactivateBtn){
      var rid = reactivateBtn.getAttribute('data-reactivate');
      var lead4 = leads.find(function(l){ return l.id === rid; });
      persistUpdate('leads', rid, { etapa: (lead4 && lead4.etapaAnterior) || 'recebido', atualizadoEm: nowIso() });
      return;
    }

    var cardEl = e.target.closest('.card');
    if(cardEl){
      var cardCol = cardEl.getAttribute('data-col') || 'leads';
      if(cardCol === 'financeiro') openFinModal(cardEl.getAttribute('data-id'));
      else openLeadModal(cardEl.getAttribute('data-id'));
      return;
    }

    var certRowEl = e.target.closest('.cert-row');
    if(certRowEl){ openCertModal(certRowEl.getAttribute('data-id')); return; }

    if(openMenuId && !e.target.closest('.menu-pop')){ openMenuId = null; render(); }
  });

            (linkedLead ? '<div class="pdf-upload-hint" style="margin:-4px 0 2px;">Criado automaticamente a partir do lead fechado: <b>' + escapeHtml(linkedLead.nome) + '</b></div>' : '') +
            '<div class="field"><label for="fCli">Cliente / empresa *</label><input id="fCli" type="text" value="' + escapeHtml(proj ? proj.cliente : '') + '" /></div>' +
            '<div class="field"><label for="fContF">Contato</label><input id="fContF" type="text" placeholder="Telefone, WhatsApp ou e-mail" value="' + escapeHtml(proj ? proj.contato : '') + '" /></div>' +
            '<div class="row2">' +
              '<div class="field"><label for="fTipoF">Tipo de serviço</label><select id="fTipoF">' + svcOptions + '</select></div>' +
              '<div class="field"><label for="fEtapaF">Etapa</label><select id="fEtapaF">' + stageOptions + '</select></div>' +
            '</div>' +
            '<div class="field"><label for="fValorF">Valor (R$)</label><input id="fValorF" type="number" min="0" step="100" value="' + (proj && proj.valor != null ? proj.valor : '') + '" /></div>' +
            '<div class="field"><label for="fObsF">Observações</label><textarea id="fObsF">' + escapeHtml(proj ? proj.observacoes : '') + '</textarea></div>' +
            '<div class="req-err" id="reqErr"></div>' +
            '<div class="modal-actions">' +
              (editing ? '<button class="btn btn-ghost btn-danger-text" id="btnDeleteInModal">Excluir projeto</button>' : '<span></span>') +
              '<button class="btn btn-primary" id="btnSaveFin">' + (editing ? 'Salvar alterações' : 'Adicionar projeto') + '</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    document.getElementById('btnCloseModal').addEventListener('click', closeModal);
    document.getElementById('overlay').addEventListener('click', function(e){ if(e.target.id === 'overlay') closeModal(); });
    document.addEventListener('keydown', escHandler);
    function escHandler(e){ if(e.key === 'Escape'){ closeModal(); document.removeEventListener('keydown', escHandler); } }

    if(editing){
      document.getElementById('btnDeleteInModal').addEventListener('click', function(){
        if(confirm('Excluir o projeto financeiro de "' + proj.cliente + '"? Essa ação não pode ser desfeita.')){
          persistDelete('financeiro', id); closeModal();
        }
      });
    }

    document.getElementById('btnSaveFin').addEventListener('click', function(){
      var cliente = document.getElementById('fCli').value.trim();
      if(!cliente){ document.getElementById('reqErr').textContent = 'Informe o nome do cliente ou empresa.'; document.getElementById('fCli').focus(); return; }
      var data = {
        cliente: cliente,
        contato: document.getElementById('fContF').value.trim(),
        tipoServico: document.getElementById('fTipoF').value || null,
        etapa: document.getElementById('fEtapaF').value,
        valor: Number(document.getElementById('fValorF').value) || 0,
        observacoes: document.getElementById('fObsF').value.trim(),
        atualizadoEm: nowIso()
      };
      if(editing){
        persistUpdate('financeiro', id, data);
      } else {
        data.criadoEm = nowIso();
        data.isExample = false;
        data.leadId = null;
        persistAdd('financeiro', data);
      }
      closeModal();
    });

    setTimeout(function(){ document.getElementById('fCli').focus(); }, 30);
  }

  /* ---------------- pdf upload / autofill (certificados) ---------------- */
  var PDFJS_VERSION = '2.6.347';
  var pdfJsLoadPromise = null;
  function loadPdfJs(){
    if(pdfJsLoadPromise) return pdfJsLoadPromise;
    pdfJsLoadPromise = new Promise(function(resolve, reject){
      if(window.pdfjsLib){ resolve(window.pdfjsLib); return; }
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/' + PDFJS_VERSION + '/pdf.min.js';
      s.onload = function(){
        try{
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/' + PDFJS_VERSION + '/pdf.worker.min.js';
          resolve(window.pdfjsLib);
        } catch(err){ reject(err); }
      };
      s.onerror = function(){ reject(new Error('pdfjs_load_failed')); };
      document.head.appendChild(s);
    });
    return pdfJsLoadPromise;
  }

  var sampleCapPromise = null;
  function getSample(){
    if(!sampleCapPromise){
      sampleCapPromise = (window.claude && typeof window.claude.use === 'function')
        ? window.claude.use('sample')
        : Promise.resolve(null);
    }
    return sampleCapPromise;
  }

  function parseMoneyLoose(v){
    if(v == null) return null;
    if(typeof v === 'number') return isFinite(v) ? v : null;
    var s = String(v).trim();
    if(!s) return null;
    s = s.replace(/R\$\s?/gi, '').replace(/\s+/g, '');
    if(/^\d{1,3}(\.\d{3})*(,\d+)?$/.test(s)){
      s = s.replace(/\./g, '').replace(',', '.');
    } else if(/^\d+,\d+$/.test(s)){
      s = s.replace(',', '.');
    } else {
      s = s.replace(/[^\d.\-]/g, '');
    }
    var n = Number(s);
    return isFinite(n) ? n : null;
  }

  // Rebuild a PDF page's text line by line (grouping items by Y, ordering by X) so tables and
  // "label: value" layouts stay readable — a flat join of pdf.js text items scrambles this order.
  function reconstructPageText(textContent){
    var items = (textContent.items || []).filter(function(it){ return it.str && it.str.length; });
    var lines = [];
    items.forEach(function(it){
      var tr = it.transform || [1,0,0,1,0,0];
      var x = tr[4], y = tr[5];
      var line = null;
      for(var i=0;i<lines.length;i++){ if(Math.abs(lines[i].y - y) <= 2){ line = lines[i]; break; } }
      if(!line){ line = { y:y, parts:[] }; lines.push(line); }
      line.parts.push({ x:x, str:it.str });
    });
    lines.sort(function(a,b){ return b.y - a.y; });
    return lines.map(function(line){
      line.parts.sort(function(a,b){ return a.x - b.x; });
      return line.parts.map(function(p){ return p.str; }).join(' ');
    }).join('\n');
  }

  var PDF_EXTRACT_SPECS = {
    certificado: {
      docLabel: 'um certificado de vistoria do Corpo de Bombeiros brasileiro (CLCB ou AVCB)',
      jsonShape: '{"cliente": string ou null, "endereco": string ou null, "contato": string ou null, "tipo": "clcb" ou "avcb" ou null, ' +
        '"numeroProcesso": string ou null, "dataEmissao": "AAAA-MM-DD" ou null, "dataVencimento": "AAAA-MM-DD" ou null}',
      extraRules: '"cliente" é o nome do proprietário, empresa ou condomínio da edificação (nunca o nome do Corpo de Bombeiros).',
      apply: function(data){
        var setVal = function(id, v){ var el = document.getElementById(id); if(el && v) el.value = v; };
        if(data.cliente) setVal('fCliente', data.cliente);
        if(data.endereco) setVal('fEndereco', data.endereco);
        if(data.contato) setVal('fContatoC', data.contato);
        if(data.tipo === 'clcb' || data.tipo === 'avcb') setVal('fTipoC', data.tipo);
        if(data.numeroProcesso) setVal('fNumero', data.numeroProcesso);
        if(data.dataEmissao && /^\d{4}-\d{2}-\d{2}$/.test(data.dataEmissao)) setVal('fEmissao', data.dataEmissao);
        if(data.dataVencimento && /^\d{4}-\d{2}-\d{2}$/.test(data.dataVencimento)) setVal('fVencimento', data.dataVencimento);
      }
    },
    lead: {
      docLabel: 'uma proposta comercial de serviços de engenharia (projeto estrutural, vistoria/laudo ou projeto de combate a incêndio — PPCI) enviada a um cliente',
      jsonShape: '{"nome": string ou null, "contato": string ou null, ' +
        '"tipoServico": "estrutural" ou "revisao" ou "vistoria_simples" ou "vistoria_completa" ou "laudos" ou "ppci" ou "clcb" ou null, ' +
        '"valorEstimado": number ou null}',
      extraRules: '"nome" é o cliente, empresa ou condomínio contratante (nunca o nome de quem emitiu a proposta). ' +
        '"tipoServico" é o serviço principal da proposta — "estrutural" para projeto estrutural novo, "revisao" para revisão de projeto existente, ' +
        '"vistoria_simples" ou "vistoria_completa" conforme o texto indicar o tipo de vistoria, "laudos" para laudo técnico, "ppci" para projeto de combate a incêndio, "clcb" quando o serviço é a obtenção do CLCB. ' +
        '"valorEstimado" é o valor TOTAL da proposta (procure por "valor total", "total geral" ou o maior valor monetário do documento), como número JSON puro — NUNCA como texto/string, sem "R$", sem separador de milhar, e com PONTO (não vírgula) como separador decimal se houver centavos. Exemplo correto: 27500 ou 27500.90.',
      apply: function(data){
        var setVal = function(id, v){ var el = document.getElementById(id); if(el && v) el.value = v; };
        if(data.nome) setVal('fNome', data.nome);
        if(data.contato) setVal('fContato', data.contato);
        if(data.tipoServico && SERVICE_TYPES[data.tipoServico]) setVal('fTipo', data.tipoServico);
        var valor = parseMoneyLoose(data.valorEstimado);
        if(valor != null) setVal('fValor', valor);
      }
    }
  };

  function extractPdfToFields(file, statusEl, kind){
    var spec = PDF_EXTRACT_SPECS[kind];
    function setStatus(cls, text){ statusEl.className = 'pdf-upload-status' + (cls ? ' ' + cls : ''); statusEl.textContent = text; }
    setStatus('', 'Lendo o PDF…');

    getSample().then(function(sample){
      if(!sample){
        setStatus('err', 'Preenchimento automático não está disponível aqui agora — preencha manualmente, ou me envie o PDF no chat.');
        return;
      }
      var pdfjsLib, pdfDoc, page, extractedText, usedImage = false;
      loadPdfJs()
        .then(function(lib){ pdfjsLib = lib; return file.arrayBuffer(); })
        .then(function(buf){ return pdfjsLib.getDocument({ data: buf }).promise; })
        .then(function(doc){ pdfDoc = doc; return pdfDoc.getPage(1); })
        .then(function(pg){
          page = pg;
          return page.getTextContent();
        })
        .then(function(textContent){
          extractedText = reconstructPageText(textContent).trim();
          var needsImage = !extractedText || extractedText.length < 40;
          if(!needsImage) return null;
          setStatus('', 'PDF sem texto — lendo como imagem…');
          return sample.limits().catch(function(){ return null; }).then(function(caps){
            if(!caps || !caps.images) return null;
            var viewport = page.getViewport({ scale: 1.6 });
            var canvas = document.createElement('canvas');
            canvas.width = viewport.width; canvas.height = viewport.height;
            return page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise.then(function(){
              return new Promise(function(res){ canvas.toBlob(res, 'image/png'); });
            });
          });
        })
        .then(function(imageBlob){
          var prompt =
            'O texto abaixo (ou a imagem anexada, se o texto vier vazio) é de ' + spec.docLabel + '. ' +
            'Extraia os dados e responda SOMENTE com um JSON neste formato exato:\n' + spec.jsonShape + '\n' +
            spec.extraRules + ' Se não encontrar um campo com certeza, use null — nunca invente um valor.\n\n' +
            'Texto extraído do PDF:\n' + (extractedText ? extractedText.slice(0, 6000) : '(vazio — use a imagem anexada)');

          var opts = { modelTier: 'quick' };
          if(imageBlob){ opts.images = [imageBlob]; opts.modelTier = 'default'; usedImage = true; }

          setStatus('', 'Extraindo dados com o Claude…');
          return sample.json(prompt, opts);
        })
        .then(function(data){
          spec.apply(data || {});
          setStatus('ok', 'Dados extraídos' + (usedImage ? ' (a partir da imagem)' : '') + ' — confira os campos abaixo antes de salvar.');
        })
        .catch(function(e){
          var code = e && e.code;
          if(code === 'not_granted'){ setStatus('err', 'Você não autorizou o uso do Claude aqui — preencha manualmente, ou me envie o PDF no chat.'); }
          else if(code === 'rate_limited'){ setStatus('err', 'Muitas tentativas agora — espere um instante e tente de novo.'); }
          else if(code === 'invalid_json' || code === 'refused' || code === 'empty_completion'){ setStatus('err', 'Não consegui interpretar esse PDF automaticamente — preencha manualmente.'); }
          else { setStatus('err', 'Não consegui ler esse PDF automaticamente — preencha manualmente, ou me envie o PDF no chat.'); }
        });
    });
  }

  /* ---------------- boot ---------------- */
  buildChips();
  render();
  initDb();
  setTimeout(function(){
    if(dbHandle) maybeSeedExamples();
  }, 600);

})();
